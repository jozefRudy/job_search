name: Release

on:
  workflow_run:
    workflows: [Build]
    types: [completed]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check Cargo version against latest release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.check.outputs.skip == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ steps.check.outputs.version }}"
          if git ls-remote --exit-code --tags origin "v${version}" >/dev/null 2>&1; then
            echo "tag v${version} already exists, skipping"
          else
            git tag "v${version}"
            git push origin "v${version}"
          fi

      - name: Download artifacts
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Upload binaries to release
        if: steps.check.outputs.skip == 'false'
        uses: svenstaro/upload-release-action@v2
        with:
          file: bins-*/jobsearch-*.tar.gz
          file_glob: true
          tag: v${{ steps.check.outputs.version }}
          overwrite: true

  update-flake:
    name: Update flake
    needs: [publish]
    if: needs.publish.outputs.skip == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Update hashes in flake.nix
        run: |
          set -euo pipefail
          version="${{ needs.publish.outputs.version }}"
          hash_sri() {
            openssl dgst -sha256 -binary "$1" | base64 -w0
          }
          mac=$(hash_sri "bins-aarch64-macos/jobsearch-v${version}-aarch64-macos.tar.gz")
          sed -i \
            -e "s|^      aarch64-darwin = \"sha256-.*\";|      aarch64-darwin = \"sha256-${mac}\";|" \
            flake.nix
          grep -A3 'hashes = ' flake.nix

      - name: Commit and push flake.nix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          if git diff --cached --quiet; then
            echo "flake.nix already up to date"
            exit 0
          fi
          git commit -m "chore: update flake for v${{ needs.publish.outputs.version }}"
          git push origin HEAD:main

  verify:
    name: Verify Nix flake
    needs: [update-flake]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Build and smoke test
        run: |
          set -euo pipefail
          nix build .#job-search
          ./result/bin/jobsearch --help >/dev/null
