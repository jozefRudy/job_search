name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  ONNX_VERSION: 1.24.2

jobs:
  dist:
    name: Dist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: x86_64-linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            onnx: linux-x64
            rpath: '$ORIGIN/../lib'
          - build: aarch64-macos
            os: macos-latest
            target: aarch64-apple-darwin
            onnx: osx-arm64
            rpath: '@loader_path/../lib'

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: '27.3'

      - uses: Swatinem/rust-cache@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Download ONNX Runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fLo onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ONNX_VERSION}/onnxruntime-${{ matrix.onnx }}-${ONNX_VERSION}.tgz"
          mkdir -p onnxruntime
          tar xzf onnxruntime.tgz -C onnxruntime --strip-components 1
          rm onnxruntime.tgz

      - name: Build release binary
        shell: bash
        env:
          SQLX_OFFLINE: "true"
          ORT_PREFER_DYNAMIC_LINK: "1"
          ORT_LIB_PATH: ${{ github.workspace }}/onnxruntime/lib
          RUSTFLAGS: -Clink-arg=-Wl,-rpath,${{ matrix.rpath }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.build }}/bin
          cp "target/${{ matrix.target }}/release/jobsearch" "dist/${{ matrix.build }}/bin/"
          cp -RL onnxruntime/lib "dist/${{ matrix.build }}/lib"

      - name: Create tarball
        shell: bash
        run: tar czf "jobsearch-${{ matrix.build }}.tar.gz" -C dist "${{ matrix.build }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.build }}
          path: jobsearch-${{ matrix.build }}.tar.gz

  publish:
    name: Publish
    needs: [dist]
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: bins-*/jobsearch-*.tar.gz
          file_glob: true
          tag: ${{ github.ref_name }}
          overwrite: true
